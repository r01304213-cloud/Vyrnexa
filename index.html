<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vyrnexa AI</title>

<style>
:root{
  --bg:#090d13;
  --panel:#101722;
  --panel2:#171f2b;
  --border:#273345;
  --text:#edf3fa;
  --muted:#8997aa;
  --accent:#42dbc9;
  --user:#1b3048;
  --danger:#ff6f7d;
}
:root[data-theme="light"]{
  --bg:#f3f6fa;
  --panel:#fff;
  --panel2:#edf1f6;
  --border:#d4dce7;
  --text:#151b25;
  --muted:#607086;
  --accent:#087f75;
  --user:#dce9f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{
  font:inherit;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
}
button{
  cursor:pointer;
  padding:10px 14px;
}
button.primary{
  background:var(--accent);
  color:#061815;
  border:0;
  font-weight:700;
}
button.secondary{background:var(--panel2)}
button.danger{color:var(--danger)}
input,textarea,select{padding:10px}
textarea{resize:vertical}
#app{
  display:flex;
  height:100dvh;
  overflow:hidden;
}
#sidebar{
  width:280px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 4px;
}
.brand b{font-size:19px}
.brand small{display:block;color:var(--muted)}
#newChat{width:100%}
#chatList{
  flex:1;
  overflow:auto;
}
.chatItem{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:3px;
}
.chatItem:hover,.chatItem.active{background:var(--panel2)}
.chatTitle{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.chatDelete{
  padding:3px 7px;
  background:transparent;
  border:0;
  color:var(--muted);
}
#main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
#topbar{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}
#menuBtn{display:none}
#page{
  flex:1;
  min-height:0;
  overflow:auto;
}
.pageInner{
  max-width:1000px;
  width:100%;
  margin:auto;
  padding:18px;
}
#messages{
  max-width:900px;
  margin:auto;
  padding:18px;
}
.message{
  margin-bottom:16px;
}
.message.user{
  display:flex;
  justify-content:flex-end;
}
.bubble{
  max-width:min(820px,100%);
  padding:12px 15px;
  border-radius:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user .bubble{
  background:var(--user);
}
.assistant .bubble{
  background:var(--panel);
  border:1px solid var(--border);
}
.meta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}
#composer{
  border-top:1px solid var(--border);
  background:var(--panel);
  padding:10px;
}
.composeInner{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:8px;
  align-items:flex-end;
}
#prompt{
  flex:1;
  min-height:48px;
  max-height:170px;
}
#send{
  min-height:48px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:15vh 20px;
}
.empty h1{color:var(--text)}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding-bottom:8px;
  position:relative;
  z-index:20;
}
.tabs button{
  flex:0 0 auto;
  min-width:90px;
  position:relative;
  z-index:21;
  touch-action:manipulation;
}
.tabs button.active{
  background:var(--accent);
  color:#061815;
  border-color:var(--accent);
  font-weight:700;
}
#labEditor{
  width:100%;
  min-height:420px;
  font-family:ui-monospace,Consolas,monospace;
  font-size:13px;
  line-height:1.5;
  background:#080c12;
  color:#e7eef8;
  border-radius:10px;
  padding:14px;
}
#preview{
  width:100%;
  height:520px;
  border:1px solid var(--border);
  border-radius:10px;
  background:white;
}
.console{
  min-height:300px;
  background:#080c12;
  color:#d8e5f2;
  padding:12px;
  border-radius:10px;
  font-family:ui-monospace,Consolas,monospace;
  white-space:pre-wrap;
  overflow:auto;
}
.console .error{color:#ff7885}
.console .warn{color:#f0c85c}
.stat{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.statBox{
  background:var(--panel2);
  padding:14px;
  border-radius:10px;
}
.statBox b{
  display:block;
  font-size:20px;
}
.setting{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.project{
  padding:12px;
  background:var(--panel2);
  border-radius:10px;
  margin-bottom:8px;
}
.project b{display:block}
.project small{color:var(--muted)}
#toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:var(--text);
  color:var(--bg);
  padding:9px 14px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}
#toast.show{opacity:1}
@media(max-width:760px){
  #sidebar{
    position:fixed;
    inset:0 auto 0 0;
    width:min(310px,84vw);
    z-index:50;
    transform:translateX(-105%);
    transition:.2s;
    box-shadow:20px 0 50px #0008;
  }
  #sidebar.open{transform:none}
  #menuBtn{display:block}
  #messages{padding:12px}
  .pageInner{padding:12px}
  .stat{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div>
        <b>Vyrnexa AI</b>
        <small>Intelligence, connected.</small>
      </div>
      <button id="closeMenu">×</button>
    </div>

    <button class="primary" id="newChat">＋ New Chat</button>

    <div id="chatList"></div>

    <button class="secondary" id="clearChats">Clear Chats</button>
  </aside>

  <main id="main">

    <header id="topbar">
      <button id="menuBtn">☰</button>
      <b id="pageTitle">Vyrnexa AI</b>
      <span style="flex:1"></span>
      <button id="themeBtn">Theme</button>
    </header>

    <section id="page"></section>

    <footer id="composer">
      <div class="composeInner">
        <textarea id="prompt" placeholder="Ask Vyrnexa anything..."></textarea>
        <button class="primary" id="send">Send</button>
      </div>
    </footer>

  </main>
</div>

<div id="toast"></div>

<script>
const ENDPOINT =
  "https://vyrnexa.r01304213.workers.dev/api/gemini";

const DEFAULT_LAB = {
  html:
`<h1>Hello Vyrnexa</h1>
<p>Welcome to Coding Lab.</p>
<button onclick="hello()">Click me</button>`,

  css:
`body{
  font-family:system-ui,sans-serif;
  padding:30px;
  background:#101722;
  color:white;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
}`,

  js:
`function hello(){
  console.log("Hello from Vyrnexa!");
  alert("JavaScript is working!");
}

console.log("JavaScript ready.");`
};

let state = {
  chats: [],
  currentChat: null,
  memories: [],
  projects: [
    {id:"default",name:"General",description:"Default Vyrnexa project"}
  ],
  settings:{
    theme:"dark",
    temperature:.7
  },
  lab:{...DEFAULT_LAB}
};

let labTab = "html";
let labLogs = [];
let labRunning = false;

try{
  const saved = JSON.parse(localStorage.getItem("vyrnexa_state"));
  if(saved){
    state = {
      ...state,
      ...saved,
      settings:{
        ...state.settings,
        ...(saved.settings||{})
      },
      lab:{
        ...DEFAULT_LAB,
        ...(saved.lab||{})
      }
    };
  }
}catch(e){}

function save(){
  localStorage.setItem(
    "vyrnexa_state",
    JSON.stringify(state)
  );
}

function $(id){
  return document.getElementById(id);
}

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function toast(text){
  const t=$("toast");
  t.textContent=text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}

function currentChat(){
  return state.chats.find(
    c=>c.id===state.currentChat
  );
}

function createChat(){
  const chat={
    id:crypto.randomUUID(),
    title:"New Chat",
    messages:[],
    created:Date.now()
  };

  state.chats.unshift(chat);
  state.currentChat=chat.id;
  save();
  renderChatList();
  renderChat();
}

function renderChatList(){
  const box=$("chatList");

  if(!state.chats.length){
    box.innerHTML=
      '<div style="color:var(--muted);padding:12px">No chats yet.</div>';
    return;
  }

  box.innerHTML=state.chats.map(chat=>`
    <div class="chatItem ${chat.id===state.currentChat?"active":""}"
         data-chat="${chat.id}">
      <span class="chatTitle">${escapeHTML(chat.title)}</span>
      <button class="chatDelete" data-delete-chat="${chat.id}">×</button>
    </div>
  `).join("");
}

function renderChat(){
  $("pageTitle").textContent="Vyrnexa AI";
  $("composer").style.display="block";

  const chat=currentChat();

  if(!chat){
    $("page").innerHTML=`
      <div class="empty">
        <h1>Vyrnexa AI</h1>
        <p>Your connected AI workspace.</p>
        <button class="primary" id="startChat">Start Chat</button>
      </div>
    `;

    $("startChat").onclick=createChat;
    return;
  }

  $("page").innerHTML=`
    <div id="messages"></div>
  `;

  const messages=$("messages");

  if(!chat.messages.length){
    messages.innerHTML=`
      <div class="empty">
        <h1>Hello.</h1>
        <p>I'm Vyrnexa. What do you want to build?</p>
      </div>
    `;
    return;
  }

  chat.messages.forEach(m=>{
    const el=document.createElement("div");
    el.className="message "+m.role;

    el.innerHTML=`
      <div class="bubble">${escapeHTML(m.content)}</div>
      <div class="meta">${m.role==="user"?"You":"Vyrnexa"}</div>
    `;

    messages.appendChild(el);
  });

  requestAnimationFrame(()=>{
    $("page").scrollTop=$("page").scrollHeight;
  });
}

async function sendMessage(){
  const input=$("prompt");
  const text=input.value.trim();

  if(!text)return;

  if(!currentChat())createChat();

  const chat=currentChat();

  if(chat.title==="New Chat"){
    chat.title=text.slice(0,40);
  }

  chat.messages.push({
    role:"user",
    content:text
  });

  input.value="";
  save();
  renderChat();
  renderChatList();

  const loading=document.createElement("div");
  loading.className="message assistant";
  loading.innerHTML=
    '<div class="bubble">Thinking...</div>';
  $("messages").appendChild(loading);

  try{

    const response=await fetch(ENDPOINT,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({
        messages:chat.messages,
        temperature:Number(state.settings.temperature)||.7
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data.error||"API request failed"
      );
    }

    const answer=data.text||"No response received.";

    chat.messages.push({
      role:"assistant",
      content:answer
    });

    save();
    renderChat();

  }catch(error){

    loading.innerHTML=`
      <div class="bubble" style="border-color:var(--danger)">
        Error: ${escapeHTML(error.message)}
      </div>
    `;

    toast("Vyrnexa API error");
  }
}

function buildLabDocument(){

  return `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
${state.lab.css}
</style>
</head>

<body>
${state.lab.html}

<script>
(function(){

  function report(type,args){

    parent.postMessage({
      vyrnexaLab:true,
      type:type,
      message:Array.from(args)
        .map(x=>{
          try{return typeof x==="string"
            ?x
            :JSON.stringify(x)}
          catch(e){return String(x)}
        })
        .join(" ")
    },"*");
  }

  ["log","info","warn","error"].forEach(type=>{
    const original=console[type];

    console[type]=function(){
      report(type,arguments);
      original.apply(console,arguments);
    };
  });

  window.onerror=function(message,source,line){
    report(
      "error",
      [message+" (line "+line+")"]
    );
  };

})();
<\/script>

<script>
${state.lab.js}
<\/script>

</body>
</html>`;
}

function renderCodingLab(){

  $("pageTitle").textContent="Coding Lab";
  $("composer").style.display="none";

  $("page").innerHTML=`
    <div class="pageInner">

      <div class="card">
        <h2 style="margin-top:0">Coding Lab</h2>
        <p style="color:var(--muted)">
          Build and test HTML, CSS and JavaScript.
        </p>

        <div class="tabs" id="labTabs">
          ${[
            ["html","HTML"],
            ["css","CSS"],
            ["js","JavaScript"],
            ["console","Console"],
            ["preview","Preview"]
          ].map(([id,name])=>`
            <button
              type="button"
              class="${labTab===id?"active":""}"
              data-lab-tab="${id}">
              ${name}
            </button>
          `).join("")}
        </div>

        <div id="labContent"></div>

        <div class="row" style="margin-top:10px">
          <button class="primary" id="runLab">Run</button>
          <button class="secondary" id="resetLab">Reset</button>
          <button class="secondary" id="clearConsole">Clear Console</button>
        </div>

      </div>

    </div>
  `;

  renderLabContent();

  document
    .querySelectorAll("[data-lab-tab]")
    .forEach(button=>{

      button.addEventListener("click",()=>{

        labTab=button.dataset.labTab;

        save();

        renderCodingLab();

      });

    });

  $("runLab").onclick=runLab;

  $("resetLab").onclick=()=>{
    state.lab={...DEFAULT_LAB};
    labLogs=[];
    save();
    renderCodingLab();
  };

  $("clearConsole").onclick=()=>{
    labLogs=[];
    renderCodingLab();
  };
}

function renderLabContent(){

  const box=$("labContent");

  if(labTab==="html"||
     labTab==="css"||
     labTab==="js"){

    box.innerHTML=`
      <textarea
        id="labEditor"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    `;

    const editor=$("labEditor");

    editor.value=state.lab[labTab];

    editor.addEventListener("input",()=>{
      state.lab[labTab]=editor.value;
      save();
    });

    return;
  }

  if(labTab==="console"){

    box.innerHTML=`
      <div class="console">
        ${
          labLogs.length
          ?labLogs.map(x=>
            `<div class="${x.type}">
              [${escapeHTML(x.type)}] ${escapeHTML(x.message)}
            </div>`
          ).join("")
          :"Console is empty. Press Run."
        }
      </div>
    `;

    return;
  }

  if(labTab==="preview"){

    box.innerHTML=`
      <iframe
        id="preview"
        sandbox="allow-scripts"
        title="Vyrnexa Coding Lab Preview">
      </iframe>
    `;

    $("preview").srcdoc=buildLabDocument();
  }
}

function runLab(){

  labLogs=[];
  labRunning=true;

  labTab="preview";

  renderCodingLab();

  const frame=$("preview");

  if(!frame)return;

  frame.srcdoc=buildLabDocument();

  toast("Coding Lab running");
}

window.addEventListener("message",event=>{

  if(
    !event.data||
    event.data.vyrnexaLab!==true
  )return;

  labLogs.push({
    type:event.data.type||"log",
    message:String(event.data.message||"")
  });

  if(labTab==="console"){
    renderCodingLab();
  }
});

function renderMemory(){

  $("pageTitle").textContent="Memory";
  $("composer").style.display="none";

  $("page").innerHTML=`
    <div class="pageInner">

      <div class="card">
        <h2>Memory</h2>

        <textarea
          id="memoryInput"
          placeholder="Add something Vyrnexa should remember..."
        ></textarea>

        <button class="primary" id="addMemory"
                style="margin-top:8px">
          Save Memory
        </button>
      </div>

      <div class="card">
        <h3>Saved Memories</h3>

        ${
          state.memories.length
          ?state.memories.map((m,i)=>`
            <div class="project">
              ${escapeHTML(m)}
              <button
                class="secondary danger"
                data-memory="${i}"
                style="float:right">
                Delete
              </button>
            </div>
          `).join("")
          :'<p style="color:var(--muted)">No memories yet.</p>'
        }
      </div>

    </div>
  `;

  $("addMemory").onclick=()=>{
    const value=$("memoryInput").value.trim();

    if(!value)return;

    state.memories.push(value);
    save();
    renderMemory();
  };

  document
    .querySelectorAll("[data-memory]")
    .forEach(btn=>{
      btn.onclick=()=>{
        state.memories.splice(
          Number(btn.dataset.memory),1
        );
        save();
        renderMemory();
      };
    });
}

function renderProjects(){

  $("pageTitle").textContent="Projects";
  $("composer").style.display="none";

  $("page").innerHTML=`
    <div class="pageInner">

      <div class="card">
        <h2>Projects</h2>

        <input
          id="projectName"
          placeholder="Project name"
        >

        <button
          class="primary"
          id="createProject"
          style="margin-top:8px">
          Create Project
        </button>
      </div>

      <div class="card">

        ${
          state.projects.map(p=>`
            <div class="project">
              <b>${escapeHTML(p.name)}</b>
              <small>${escapeHTML(p.description||"")}</small>
            </div>
          `).join("")
        }

      </div>

    </div>
  `;

  $("createProject").onclick=()=>{
    const name=$("projectName").value.trim();

    if(!name)return;

    state.projects.push({
      id:crypto.randomUUID(),
      name:name,
      description:"Vyrnexa project"
    });

    save();
    renderProjects();
  };
}

function renderSettings(){

  $("pageTitle").textContent="Settings";
  $("composer").style.display="none";

  $("page").innerHTML=`
    <div class="pageInner">

      <div class="card">

        <h2>Settings</h2>

        <div class="setting">
          <span>Theme</span>
          <select id="themeSelect">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="setting">
          <span>Temperature</span>
          <input
            id="tempSelect"
            type="number"
            min="0"
            max="2"
            step=".1"
            style="width:100px">
        </div>

      </div>

      <div class="card">
        <h3>Storage</h3>
        <p style="color:var(--muted)">
          Chats, memory and Coding Lab data are saved
          locally on this device.
        </p>

        <button class="danger secondary" id="wipeData">
          Erase Local Data
        </button>
      </div>

    </div>
  `;

  $("themeSelect").value=state.settings.theme;
  $("tempSelect").value=state.settings.temperature;

  $("themeSelect").onchange=e=>{
    state.settings.theme=e.target.value;
    applyTheme();
    save();
  };

  $("tempSelect").onchange=e=>{
    state.settings.temperature=
      Math.max(
        0,
        Math.min(2,Number(e.target.value)||.7)
      );
    save();
  };

  $("wipeData").onclick=()=>{
    if(confirm("Erase all Vyrnexa local data?")){
      localStorage.removeItem("vyrnexa_state");
      location.reload();
    }
  };
}

function renderDashboard(){

  $("pageTitle").textContent="Vyrnexa AI";
  $("composer").style.display="none";

  $("page").innerHTML=`
    <div class="pageInner">

      <div class="card">
        <h1>Vyrnexa AI</h1>
        <p style="color:var(--muted)">
          Your personal AI workspace.
        </p>
      </div>

      <div class="stat">

        <div class="statBox">
          Chats
          <b>${state.chats.length}</b>
        </div>

        <div class="statBox">
          Memories
          <b>${state
