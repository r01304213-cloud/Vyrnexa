/* Server-validated leaderboard. Backend contract: GET ?action=leaderboard&limit=50 -> {rows:[{name,stars}],me:{rank,stars}}; POST {action:'answer',name,questionId,subject,topic,answer}. Server re-validates answers and calculates Stars. */
const LB={rows:[],me:null,busy:false,err:'',loadedAt:0,
 url(){return String(S.set.learnLeaderboardUrl||'').trim()},
 async load(force=false){const u=this.url();if(!u){this.rows=[];this.me=null;this.err='';return false}if(!force&&this.loadedAt&&Date.now()-this.loadedAt<15000)return true;this.busy=true;this.err='';try{const r=await fetch(u+(u.includes('?')?'&':'?')+'action=leaderboard&limit=50',{headers:{Accept:'application/json'}});if(!r.ok)throw Error('Leaderboard server error '+r.status);const j=await r.json();if(!Array.isArray(j.rows))throw Error('Invalid leaderboard response: rows array missing');this.rows=j.rows.slice(0,50).map(x=>({name:String(x.name||'Learner').slice(0,20),stars:Math.max(0,Math.floor(+x.stars||0))}));this.me=j.me||null;this.loadedAt=Date.now();this.err='';return true}catch(e){this.err=e.message||'Could not load leaderboard';errs.push('Leaderboard: '+this.err);return false}finally{this.busy=false;drawLearn()}},
 async submit(q,r){const u=this.url();if(!u||!q||!chk(q,r))return;try{await fetch(u,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({action:'answer',name:LS.name||'Learner',questionId:q.id,subject:q.s,topic:q.t,answer:r})})}catch(e){errs.push('Leaderboard submit: '+(e.message||'request failed'))}}
};

function prep(b){const q={...b,lv:b.l,tries:0,hints:0,done:false,bad:[]};
 if(b.k==='order'){let s=shf(b.o);if(JSON.stringify(s)===JSON.stringify(b.o))s=s.reverse();q.o=s;q.ord=[]}else if(b.k==='mc'){const m=shf(b.o.map((t,i)=>({t,c:i===b.a})));q.o=m.map(x=>x.t);q.a=m.findIndex(x=>x.c)}
 return fin3(q)}
function fin3(q){const h=(q.h||[]).slice();if(h.length<3){if(q.k==='mc'){const w=q.o.filter((t,i)=>i!==q.a).slice(0,2);h.push(`It is not "${w[0]}" or "${w[1]}".`)}else if(q.k==='fill')h.push(`The answer has ${String(q.a).length} characters and starts with "${String(q.a)[0]}".`);else if(q.k==='order')h.push(`The first item is: "${q.a[0]}".`)}q.h=h;return q}
function mkQ(s,t,lv,kinds){const g=GEN[s+'.'+t];if(g){const r=g(lv);return fin3({s,t,lv,l:lv,k:'fill',q:r.q,a:String(r.a),x:r.x,h:r.h,e:r.e,id:'g'+Math.random(),tries:0,hints:0,done:false,bad:[]})}
 const pool=BANK.filter(b=>b.s===s&&b.t===t&&(!kinds||kinds.includes(b.k)));if(!pool.length)return null;let c=pool.filter(b=>!LS.recent.includes(b.id));if(!c.length)c=pool;const d=b=>Math.abs(b.l-lv),m=Math.min(...c.map(d));return prep(pk(c.filter(b=>d(b)===m)))}
function codeStage(){const T=SJ('code').T;for(let i=0;i<T.length;i++)if(TG('code',T[i].id).r<LCFG.codeUnlock)return i;return T.length-1}
function nextQ(run){const sj=SJ(run.s);let q=null,n=0;while(!q&&n++<8){const tl=run.stage?[sj.T[codeStage()].id]:run.topics||sj.T.map(x=>x.id);run.t=pk(tl);q=mkQ(run.s,run.t,run.lv==='auto'?SG(run.s).lvl:run.lv,run.kinds)}return q}
function chk(q,r){if(q.k==='fill'){const n=v=>String(v).trim().toLowerCase().replace(/\s+/g,''),a=n(q.a),b=n(r);if(!b)return false;if(a===b||(q.x||[]).some(v=>n(v)===b))return true;const num=/^-?\d+(\.\d+)?$/;return num.test(a)&&num.test(b)&&Math.abs(parseFloat(a)-parseFloat(b))<.01}
 if(q.k==='order')return JSON.stringify(r)===JSON.stringify(q.a);return r===q.a}
function wrongMsg(q,r){if(q.k==='fill'){const a=parseFloat(q.a),b=parseFloat(r);if(!isNaN(a)&&!isNaN(b))return b>a?'Close, but your answer is a bit too high. Recheck your last step.':'Close, but your answer is a bit too low. Recheck your last step.';return 'Not quite. Check the spelling and the exact form the question asks for.'}
 if(q.k==='order'){let n=0;while(n<r.length&&r[n]===q.a[n])n++;return n?`The first ${n} item${n>1?'s are':' is'} in the right place. Rethink what comes next.`:'The order is not right yet. Start by finding what comes first.'}
 return 'That option does not fit. Re-read the question and test each choice.'}
function rec(q,out){const sg=SG(q.s),tg=TG(q.s,q.t);LS.total++;tg.n++;let note='';
 if(out==='rev'){tg.w++}else{LS.correct++;tg.r++;const base=LCFG.stars[q.lv],st=out==='ok'?base:Math.max(1,Math.ceil(base*LCFG.retry));LS.stars+=st;q.award=st;if(out==='ok'){LS.streak++;LS.best=Math.max(LS.best,LS.streak);sg.run++;sg.wr=0}}
 if(sg.run>=LCFG.up&&sg.lvl<5){sg.lvl++;sg.run=0;note='Great streak! Next questions will be '+LCFG.levels[sg.lvl]+'.'}else if(sg.wr>=LCFG.down&&sg.lvl>0){sg.lvl--;sg.wr=0;note="Let's slow down a little. Next questions will be "+LCFG.levels[sg.lvl]+'.'}
 q.note=note;LS.recent.push(q.id);if(LS.recent.length>10)LS.recent.shift();ACH.forEach(a=>{if(!LS.ach[a.id]&&a.f(LS)){LS.ach[a.id]=1;toast('Achievement: '+a.n)}});lsave()}
function answer(q,r){if(q.done)return;if(chk(q,r)){q.done=true;q.out=q.tries?'ok2':'ok';q.fb=pk(['Nice work!','Exactly right!','Great thinking!','You nailed it!']);rec(q,q.out);LB.submit(q,r);if(LU.run){LU.run.right++;LU.run.stars+=q.award||0}}
 else{q.tries++;if(q.tries===1){LS.streak=0;const g=SG(q.s);g.run=0;g.wr++;lsave()}if(q.k==='mc'||q.k==='tf')q.bad.push(r);if(q.hints<q.h.length)q.hints++;q.fb=wrongMsg(q,r);q.wrong=true}}

 return '<p class="mt">Quick, lightweight games. Correct answers earn Stars.</p>'+MG.map(g=>g.id==='code'?'<button type="button" class="tr learn-choice" data-a="lmg" data-i="'+g.id+'" aria-label="Play Coding Challenge"><span style="color:var(--a)">'+LI[SJ(g.s).i]+'</span><div style="flex:1;min-width:0;text-align:left"><b>'+esc(g.n)+'</b><div class="mt" style="font-size:12px">'+esc(g.d)+'</div></div><span aria-hidden="true">›</span></button>':'<div class="tr" data-a="lmg" data-i="'+g.id+'"><span style="color:var(--a)">'+LI[SJ(g.s).i]+'</span><div style="flex:1;min-width:0"><b>'+g.n+'</b><div class="mt" style="font-size:12px">'+g.d+(g.sp&&LS.mini.speed?' · Best '+LS.mini.speed:'')+'</div></div></div>').join('')}
function spUI(){const s=LU.sp;if(s.over)return '<div class="card" style="text-align:center"><h3>Time is up</h3><p style="font-size:28px;margin:4px 0"><b>'+s.score+'</b> correct</p><p class="mt">Best '+(LS.mini.speed||0)+' · +'+s.stars+' Stars earned</p><button data-a="lspeed" style="width:100%;min-height:50px">Play again</button><button class="g" data-a="lend" style="width:100%;min-height:48px;margin-top:8px">Back to games</button></div>';
 return '<div class="card"><div class="row" style="justify-content:space-between"><span class="lc">Score '+s.score+'</span><span class="lc" id="spt">'+s.left+'s</span></div><div style="font-size:30px;text-align:center;margin:20px 0">'+esc(s.q.q.replace('What is ','').replace('?',''))+' = ?</div><input id="lf" inputmode="numeric" autocomplete="off" placeholder="Answer" style="width:100%"><button data-a="lspa" style="width:100%;min-height:52px;margin-top:10px">Check</button></div><button class="g" data-a="lend" style="width:100%;min-height:48px">Quit</button>'}
function tProgress(){if(!LS.total)return '<div class="card" style="text-align:center"><b>No progress yet</b><p class="mt">Finish a lesson, practice question or mini-game to see your progress here.</p><button data-a="ltab" data-i="learn" style="min-height:48px">Start learning</button></div>';
 return '<div class="card"><div class="row" style="justify-content:space-between"><b>Overall progress</b><span class="tn">'+opct()+'%</span></div>'+barH(opct())+'</div><div class="sg" style="margin-bottom:12px">'+[['Questions',LS.total],['Correct',LS.correct],['Stars',fmtN(LS.stars)],['Streak',LS.streak+' (best '+LS.best+')']].map(x=>'<div class="card" style="margin:0;text-align:center"><div class="mt" style="font-size:12px">'+x[0]+'</div><b style="font-size:20px">'+x[1]+'</b></div>').join('')+'</div>'
 +SUBJ.map(s=>'<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>'+s.n+'</b><span class="tn">'+spct(s.id)+'%</span></div>'+barH(spct(s.id))+s.T.map(t=>'<div class="row" style="justify-content:space-between;flex-wrap:nowrap;font-size:12px;margin-top:6px"><span class="mt">'+t.n+'</span><span class="tn">'+tpct(s.id,t.id)+'%</span></div>').join('')+'</div>').join('')
 +'<div class="card"><b>Achievements</b>'+ACH.map(a=>'<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-top:6px"><span>'+a.n+'</span><span class="st '+(LS.ach[a.id]?'COMPLETED':'')+'">'+(LS.ach[a.id]?'Unlocked':'Locked')+'</span></div>').join('')+'</div>'}
function tBoard(){if(LB.url()&&!LB.busy&&!LB.loadedAt)LB.load();return '<div class="card"><div class="mt" style="font-size:12px">Your name</div><input id="lname" value="'+esc(LS.name)+'" maxlength="20" style="width:100%;margin:6px 0 10px"><div class="row" style="justify-content:space-between"><span>Your Stars</span><b>'+fmtN(LS.stars)+'</b></div><div class="row" style="justify-content:space-between"><span>Your rank</span><b>'+(LB.me&&LB.me.rank?'#'+fmtN(LB.me.rank):'Not ranked yet')+'</b></div>'+(LB.url()?'<button class="g" data-a="lbrefresh" style="width:100%;margin-top:8px">'+(LB.busy?'Refreshing…':'Refresh leaderboard')+'</button>':'')+'</div>'+(LB.err?'<div class="card"><span class="st ERROR">LEADERBOARD ERROR</span><p class="mt">'+esc(LB.err)+'</p></div>':'')+(LB.rows.length?'<div class="card"><b>Global Top 50</b>'+LB.rows.map((r,i)=>'<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin:6px 0"><span>#'+(i+1)+' '+esc(r.name)+'</span><b>'+fmtN(r.stars)+'</b></div>').join('')+'</div>':'<div class="card" style="text-align:center"><b>'+(LB.url()?'No leaderboard entries yet':'Global leaderboard is ready to connect')+'</b><p class="mt">'+(LB.url()?'Earn Stars and refresh to see the server-validated ranking.':'Set the learning leaderboard endpoint in Developer. The server must validate each answer and calculate Stars.')+'</p></div>')}
function planUI(){const p=LS.plan;return bk()+'<div class="card"><b>Study plan</b><p class="mt" style="font-size:13px">Try: "Learn JavaScript basics in 14 days" or "Master fractions in 5 days".</p><div class="row" style="flex-wrap:nowrap"><input id="pin" class="grow" placeholder="What do you want to learn?" style="min-width:0"><button data-a="pgen" style="min-height:48px">Create</button></div>'+(LU.planMsg?'<div class="fb no">'+esc(LU.planMsg)+'</div>':'')+'</div>'
 +(p?'<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(p.title)+'</b><span class="tn">'+p.days.filter(d=>d.done).length+' / '+p.days.length+'</span></div>'+barH(Math.round(p.days.filter(d=>d.done).length/p.days.length*100))+p.days.map((d,i)=>'<div class="tr" style="margin:8px 0 0"><button class="chp'+(d.done?' on':'')+'" data-a="pday" data-i="'+i+'" style="min-width:48px" aria-label="Mark day '+(i+1)+'">'+(d.done?'Done':'Day '+(i+1))+'</button><div style="flex:1;min-width:0">'+esc(d.label)+'</div><button class="g" data-a="pgo" data-i="'+i+'" style="min-height:40px">Open</button></div>').join('')+'</div>':'')}
function makePlan(txt){const t=txt.toLowerCase(),m=t.match(/(\d+)\s*(day|hari)/),days=Math.min(30,Math.max(2,m?+m[1]:7)),map={math:/math|matem|fraction|algebra/,eng:/english|inggris|grammar/,code:/cod|javascript|js\b|program/,geo:/geo/,logic:/logic|logika/,phys:/phys|fisika/,chem:/chem|kimia/,hist:/hist|sejarah/},sid=Object.keys(map).find(k=>map[k].test(t));if(!sid)return null;const sj=SJ(sid),n=sj.T.length,d=[];
 for(let i=0;i<days;i++){const ti=Math.min(n-1,Math.floor(i*n/days)),first=i===0||Math.floor((i-1)*n/days)!==ti;d.push({s:sid,t:sj.T[ti].id,label:i===days-1&&days>n?'Final review quiz: '+sj.n:(first?'Learn: ':'Practice: ')+sj.T[ti].n,done:false})}return{title:txt.slice(0,60),sid,days:d}}
/* tutor: free-text questions go through the existing AI pipeline (guard -> provider -> chargeAI). Static lessons and quiz mechanics are local and free. */
async function askTutor(t){const tp=TP(LU.subj,LU.topic),T=LU.tut;T.log.push({r:'u',t});T.busy=true;T.err=false;T.last=t;drawLearn();const full='Topic: '+tp.n+' ('+SJ(LU.subj).n+'). Learner asks: '+t;
 if(!await guard(full)){T.busy=false;T.log.pop();drawLearn();return}
 let out='',usage=null,fail=false;try{for await(const ch of providers.demo.stream([{role:'system',content:'You are Vyrnexa Tutor, a friendly teacher. Explain step by step and ask a check question.'},{role:'user',content:full}],{files:[],meta:[],atts:[]},{stop:false})){if(ch&&typeof ch==='object'){if(ch.usage)usage=ch.usage;continue}out+=ch}}catch(e){fail=true;errs.push(e.message)}
 T.busy=false;if(fail||!out.trim())T.err=true;else{T.log.push({r:'a',t:out});chargeAI(TK.est(full),TK.est(out),usage)}drawLearn()}
function startRun(cfg){LU.run={...cfg,i:1,right:0,stars:0};LU.q=nextQ(LU.run);LU.sp=null}
function endSpeed(){const s=LU.sp;if(!s||s.over)return;clearInterval(s.iv);s.over=true;s.stars=Math.floor(s.score/LCFG.speedPer);LS.stars+=s.stars;LS.mini.speed=Math.max(LS.mini.speed||0,s.score);lsave();if(V==='learn'&&LU.tab==='mini')drawLearn()}
function newSp(){const g=pk([GEN['math.add'](1),GEN['math.mul'](0)]);return{q:g.q,a:String(g.a)}}
const focusF=()=>{const f=$('#lf');if(f)f.focus()};
Object.assign(H,{
 ltab(el){if(LU.sp)clearInterval(LU.sp.iv);LU.tab=el.dataset.i;LU.run=null;LU.q=null;LU.sp=null;drawLearn();$('#v').scrollTop=0},
 lsubj(el){LU.subj=el.dataset.i;LU.topic=null;drawLearn();$('#v').scrollTop=0},
 lback(){if(LU.view)LU.view=null;else if(LU.topic){LU.topic=null;LU.q=null;LU.run=null}else LU.subj=null;drawLearn();$('#v').scrollTop=0},
 ltopic(el){LU.topic=el.dataset.i;LU.stage=0;LU.alt=false;LU.q=null;LU.run=null;LU.tut={log:[],busy:false,err:false};LU.view=null;drawLearn();$('#v').scrollTop=0},
 lalt(){LU.alt=!LU.alt;drawLearn()},
 lstage(){LU.stage++;if(LU.stage===3){startRun({mode:'learn',s:LU.subj,lv:'auto',topics:[LU.topic]})}drawLearn()},
 lans(el){if(LU.q){answer(LU.q,+el.dataset.i);drawLearn()}},
 lfill(){const f=$('#lf');if(!LU.q||!f)return;if(!f.value.trim()){toast('Type your answer first');return}answer(LU.q,f.value);drawLearn();if(!LU.q.done)focusF()},
 lord(el){const q=LU.q;if(q&&!q.done){q.ord.push(q.o[+el.dataset.i]);drawLearn()}},lun(el){const q=LU.q;if(q&&!q.done){q.ord.splice(+el.dataset.i,1);drawLearn()}},lrst(){if(LU.q){LU.q.ord=[];drawLearn()}},lochk(){if(LU.q){answer(LU.q,LU.q.ord.slice());if(LU.q.wrong&&!LU.q.done)LU.q.ord=[];drawLearn()}},
 lhint(){const q=LU.q;if(q&&q.hints<q.h.length){q.hints++;drawLearn()}},
 lrev(){const q=LU.q;if(!q||q.done)return;q.done=true;q.out='rev';q.fb='Here is the answer. Study it, then try the next one.';LS.streak=0;rec(q,'rev');drawLearn()},
 lnext(){const r=LU.run;if(!r)return;if(r.mode==='mini'&&r.i>=r.rounds){r.fin=true;LU.q=null;drawLearn();return}r.i++;LU.q=nextQ(r);drawLearn();$('#v').scrollTop=0},
 lend(){if(LU.sp)clearInterval(LU.sp.iv);LU.run=null;LU.q=null;LU.sp=null;drawLearn()},
 lps(el){LU.ps.s=el.dataset.i;drawLearn()},lpl(el){LU.ps.lv=el.dataset.i==='auto'?'auto':+el.dataset.i;drawLearn()},
 lpstart(){startRun({mode:'practice',s:LU.ps.s,lv:LU.ps.lv});drawLearn()},
 lmg(el){const g=MG.find(x=>x.id===el.dataset.i);if(g.sp){H.lspeed();return}startRun({mode:'mini',id:g.id,n:g.n,s:g.s,topics:g.topics,stage:g.stage,lv:'auto',rounds:LCFG.rounds});drawLearn()},
 lspeed(){if(LU.sp)clearInterval(LU.sp.iv);const s=LU.sp={left:LCFG.speedTime,score:0,stars:0,over:false,q:newSp()};s.iv=setInterval(()=>{s.left--;const t=$('#spt');if(t)t.textContent=s.left+'s';if(s.left<=0)endSpeed()},1000);LU.run=null;drawLearn();focusF()},
 lspa(){const s=LU.sp,f=$('#lf');if(!s||s.over||!f||!f.value.trim())return;LS.total++;if(chk({k:'fill',a:s.q.a},f.value)){s.score++;LS.correct++}lsave();s.q=newSp();drawLearn();focusF()},
 lplan(){LU.view='plan';LU.planMsg='';drawLearn();$('#v').scrollTop=0},
 pgen(){const t=($('#pin')||{}).value||'',p=t.trim()&&makePlan(t);if(!p){LU.planMsg=t.trim()?'Mention a subject, for example "Learn JavaScript basics in 14 days".':'Tell me what you want to learn.';drawLearn();return}LS.plan=p;LU.planMsg='';lsave();drawLearn()},
 pday(el){const d=LS.plan.days[+el.dataset.i];d.done=!d.done;lsave();drawLearn()},
 pgo(el){const d=LS.plan.days[+el.dataset.i];LU.tab='learn';LU.view=null;LU.subj=d.s;H.ltopic({dataset:{i:d.t}})},
 lbrefresh(){LB.loadedAt=0;LB.load(true)},task(){const i=$('#tin'),t=i&&i.value.trim();if(t&&!LU.tut.busy)askTutor(t)},tretry(){if(LU.tut.last&&!LU.tut.busy){LU.tut.log.pop();askTutor(LU.tut.last)}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='lf'){e.preventDefault();LU.sp&&!LU.sp.over?H.lspa():H.lfill()}if(e.target.id==='tin'){e.preventDefault();H.task()}if(e.target.id==='pin'){e.preventDefault();H.pgen()}});
document.addEventListener('change',e=>{if(e.target.id==='lname'){LS.name=e.target.value.trim().slice(0,20)||'Learner';lsave()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&H[el.dataset.a])H[el.dataset.a](el)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q')drawList();if(t.id==='notes'){P().notes=t.value;save()}if(t.id==='task')A.task=t.value;if(t.id==='sq'){SR.q=t.value;const i=$('#si');if(i)i.textContent=intentTxt()}});
document.addEventListener('change',e=>{if(e.target.id==='sm')SR.mode=e.target.value;const k=e.target.dataset.k;if(k){S.set[k]=e.target.type==='range'||e.target.type==='number'?+e.target.value:e.target.value;if(k==='temp'&&$('#tv'))$('#tv').textContent=S.set.temp;save()}});
addEventListener('keydown',e=>{if(e.key==='Escape'){H.close();closeStore()}});
draw();
</script></body></html>
